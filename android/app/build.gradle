plugins { id 'com.android.application' }

android {
    namespace 'com.executor.workspace'
    compileSdk 35
    defaultConfig {
        applicationId 'com.executor.workspace'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

tasks.register('copyWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) { include 'index.html', 'style.css', 'app.js' }
    into layout.buildDirectory.dir('generated/webAssets')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
